[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-memory-bridge"
version = "0.1.0"
description = "AirJelly CLI/MCP and reviewed daily desktop memory for agents"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
airjelly = "airjelly_bridge.cli:main"
desktop-memory = "desktop_memory.cli:main"

[tool.setuptools.packages.find]
include = ["airjelly_bridge*", "desktop_memory*"]

[project.urls]
Repository = "https://github.com/JunkaiWang-TheoPhy/desktop-memory-bridge"
Documentation = "https://github.com/JunkaiWang-TheoPhy/desktop-memory-bridge#readme"
