[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airjelly-cli"
version = "0.1.0"
description = "Local authenticated AirJelly CLI and stdio MCP bridge"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
airjelly = "airjelly_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["airjelly_bridge*"]

[project.urls]
Repository = "https://github.com/JunkaiWang-TheoPhy/AirJelly-CLI"
Documentation = "https://github.com/JunkaiWang-TheoPhy/AirJelly-CLI#readme"
